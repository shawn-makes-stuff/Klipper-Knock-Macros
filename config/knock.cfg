# Knock gestures: knock a rhythm on the printer frame to run a macro. Idle printer only.
# Include this from printer.cfg ([include knock.cfg]) and set accel_chip to your accelerometer section.
#
#   KNOCK                                list the state and all patterns
#   KNOCK RECORD=<name> MACRO=<gcode>    knock a rhythm, knock it again to confirm; it runs the macro
#   KNOCK RECORD=<name> PARROT=1         ...replays your rhythm on the toolhead
#   KNOCK RECORD=<name> PRINT=<text>     ...prints a console message (MACRO, PARROT and PRINT combine)
#   KNOCK DELETE=<name>                  remove a recorded pattern
#   KNOCK REMIND=<name>                  the toolhead plays a pattern back
#   KNOCK CALIBRATE=1                    learn your tempo (5 quick knocks twice, then 3 with pauses)
#   KNOCK CANCEL=1                       stop a RECORD or CALIBRATE
#   KNOCK ENABLED=0 | ENABLED=1          off (accelerometer powered down) / on; persists
#
# A macro with arguments needs quotes: MACRO="M117 hello". Patterns match by the proportions of the gaps
# between knocks, so knocking faster or slower still works.

[knock]
accel_chip: adxl345     # the accelerometer's section name: adxl345, lis2dw, lis3dh, or e.g. "adxl345 bed"
#threshold: 0.06        # g; raise it if fans or a neighbour trigger it
#odr: 1600              # sample rate. adxl345: 400|800|1600|3200, lis2dw: 400|800|1600, lis3dh: 400|1344
#poll_hz: 20
#echo: True             # console line for every knock group
#tolerance: 0.35        # how far gap proportions may deviate from a recorded pattern (0.35 = 35%)
#state_file:            # recorded patterns and tempo; default knock.json next to printer.cfg

# Patterns in the config: a gcode plus either count: N (any N knocks) or pattern: .-. (one symbol per
# gap, . short, - long). Recorded patterns take precedence.
#[knock_pattern hello]
#count: 2
#gcode: M118 knock knock
